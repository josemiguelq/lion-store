services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro da rede do compose o Redis é acessível pelo nome do serviço
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - redis

volumes:
  redis-data:
